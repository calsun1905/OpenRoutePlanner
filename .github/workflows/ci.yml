name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax smoke check
        run: |
          python -m compileall backend scripts/tools

      - name: Run focused and regression tests
        env:
          ORP_BERT_FORCE_GPU: "0"
          ORP_BERT_STRICT_GPU: "0"
          ORP_BERT_PARSE_TRACE: "0"
          ORP_BERT_USE_OSM: "0"
          ORP_BERT_SEED_DYNAMIC: "0"
        run: |
          pytest -q -o addopts= \
            tests/test_core/test_bert_nlp_preprocessing.py \
            tests/test_core/test_intent_template_bundle.py \
            tests/test_core/test_graph_manager_poi_fallback.py \
            tests/test_core/test_nlp_engine_poi_patterns.py \
            tests/test_core/test_poi_cache_version_token.py \
            tests/test_core/test_poi_concept_resolver.py \
            tests/test_core/test_route_engine.py \
            tests/test_api/test_routes.py \
            tests/test_api/test_poi_api.py \
            backend/test_route_steps.py \
            backend/test_weather_service.py
