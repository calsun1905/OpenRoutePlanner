name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: OpenRoutePlanner/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r OpenRoutePlanner/requirements.txt
      - name: Run root tests
        run: |
          pytest -q tests
      - name: Run OpenRoutePlanner tests
        working-directory: OpenRoutePlanner
        run: |
          pytest -q tests
