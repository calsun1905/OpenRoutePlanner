name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax smoke check
        run: |
          python -m compileall backend scripts/tools

      - name: Run focused tests
        env:
          ORP_BERT_FORCE_GPU: "0"
          ORP_BERT_STRICT_GPU: "0"
          ORP_BERT_PARSE_TRACE: "0"
          ORP_BERT_USE_OSM: "0"
          ORP_BERT_SEED_DYNAMIC: "0"
        run: |
          pytest -o addopts= tests/test_core/test_bert_nlp_preprocessing.py tests/test_core/test_intent_template_bundle.py tests/test_api/test_routes.py
