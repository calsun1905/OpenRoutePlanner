<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRouter Canli Sohbet</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1f2937;
      --panel: rgba(17, 24, 39, 0.82);
      --line: rgba(148, 163, 184, 0.35);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #06b6d4;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 8%, rgba(34, 197, 94, 0.22), transparent 32%),
        radial-gradient(circle at 92% 14%, rgba(6, 182, 212, 0.2), transparent 28%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      min-height: 100%;
      padding: 24px 16px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .header {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      backdrop-filter: blur(5px);
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      flex-direction: column;
      align-items: flex-end;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--danger);
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8);
      transition: 0.2s ease;
    }

    .dot.ok {
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.15);
    }

    .status-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .model-line {
      font-size: 12px;
      color: var(--muted);
    }

    .chat {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 16px;
      padding: 14px;
      overflow: auto;
      min-height: 52vh;
      max-height: 68vh;
      backdrop-filter: blur(5px);
    }

    .msg {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      line-height: 1.48;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: in 160ms ease;
    }

    .user {
      background: rgba(6, 182, 212, 0.12);
      border-color: rgba(6, 182, 212, 0.45);
      margin-left: 18%;
    }

    .assistant {
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.45);
      margin-right: 18%;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .composer {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      backdrop-filter: blur(5px);
    }
    .controls {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 180px 210px 1.3fr 1fr;
      gap: 8px;
    }
    .controls select,
    .controls input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.55);
      color: var(--text);
      padding: 12px 14px;
      font-size: 14px;
      min-height: 46px;
      outline: none;
    }
    .health {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 16px;
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      backdrop-filter: blur(5px);
    }
    .health-title {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }
    .health-row {
      font-size: 12px;
      color: var(--text);
      line-height: 1.45;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(2, 6, 23, 0.42);
    }
    .pill {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      margin-right: 8px;
      font-weight: 700;
    }
    .pill-ok { background: rgba(34,197,94,0.18); color: #86efac; }
    .pill-limit { background: rgba(245,158,11,0.18); color: #fcd34d; }
    .pill-credit { background: rgba(239,68,68,0.18); color: #fca5a5; }
    .pill-incompat { background: rgba(125,211,252,0.18); color: #7dd3fc; }
    .pill-other { background: rgba(148,163,184,0.18); color: #cbd5e1; }

    textarea {
      width: 100%;
      resize: none;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.55);
      color: var(--text);
      padding: 10px 12px;
      font-size: 15px;
      min-height: 52px;
      max-height: 180px;
      outline: none;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #e5e7eb;
      background: rgba(30, 41, 59, 0.8);
    }

    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #00120a;
      border: none;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @keyframes in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .user { margin-left: 6%; }
      .assistant { margin-right: 6%; }
      .composer { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="header">
      <div>
        <div class="title">OpenRouter Canli Chat</div>
        <div class="subtitle">Sadece OpenRouter modeli ile canli akisli sohbet</div>
      </div>
      <div class="status">
        <div class="status-line">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">Baglanti kontrol ediliyor...</span>
        </div>
        <div id="activeModel" class="model-line">Aktif model: -</div>
      </div>
    </section>

    <section id="chat" class="chat" aria-live="polite"></section>
    <section class="health">
      <div class="health-title">Model Durumu (Canli)</div>
      <div id="healthOk" class="health-row"><span class="pill pill-ok">CALISTI</span>-</div>
      <div id="healthStalled" class="health-row"><span class="pill pill-other">TIKANAN</span>-</div>
      <div id="healthLimit" class="health-row"><span class="pill pill-limit">LIMIT 429</span>-</div>
      <div id="healthCredit" class="health-row"><span class="pill pill-credit">API/KREDI 402</span>-</div>
      <div id="healthIncompat" class="health-row"><span class="pill pill-incompat">UYUMSUZ 400</span>-</div>
      <div id="healthOther" class="health-row"><span class="pill pill-other">DIGER</span>-</div>
    </section>

    <section class="composer">
      <div class="controls">
        <select id="modelMode" title="Model modu">
          <option value="auto" selected>Otomatik</option>
          <option value="manual">Model Sec</option>
        </select>
        <select id="modelCategory" title="Model kategori" disabled>
          <option value="all">Tum Modeller</option>
          <option value="ok">Sorunsuz Calisanlar</option>
          <option value="stalled">Tikananlar</option>
          <option value="limit">Limit Hatasi (429)</option>
          <option value="credit">Para/Kredi Gerektiren (402)</option>
          <option value="embedding">Embedding/VL (chat uyumsuz)</option>
          <option value="other">Diger/Belirsiz</option>
        </select>
        <select id="modelSelect" title="Model secimi" disabled>
          <option value="">Model sec...</option>
        </select>
        <input id="customModel" type="text" placeholder="Istersen model slug yaz (opsiyonel)" disabled />
      </div>
      <textarea id="input" placeholder="Mesajini yaz... (Enter: gonder, Shift+Enter: yeni satir)"></textarea>
      <button id="clearBtn" type="button">Temizle</button>
      <button id="sendBtn" class="primary" type="button">Gonder</button>
    </section>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const activeModelEl = document.getElementById("activeModel");
    const modelModeEl = document.getElementById("modelMode");
    const modelCategoryEl = document.getElementById("modelCategory");
    const modelSelectEl = document.getElementById("modelSelect");
    const customModelEl = document.getElementById("customModel");
    const healthOkEl = document.getElementById("healthOk");
    const healthStalledEl = document.getElementById("healthStalled");
    const healthLimitEl = document.getElementById("healthLimit");
    const healthCreditEl = document.getElementById("healthCredit");
    const healthIncompatEl = document.getElementById("healthIncompat");
    const healthOtherEl = document.getElementById("healthOther");

    const messages = [];
    let streaming = false;
    let statusInfo = null;
    let currentAttemptModel = "";

    const manualModelCandidates = [];
    const knownOkModels = new Set([
      "arcee-ai/trinity-mini:free",
      "arcee-ai/trinity-mini-20251201:free",
      "nvidia/nemotron-3-super-120b-a12b:free",
      "nvidia/nemotron-3-super-120b-a12b-20230311:free",
      "stepfun/step-3.5-flash:free",
      "nvidia/nemotron-3-nano-30b-a3b:free",
      "nvidia/nemotron-nano-9b-v2:free",
      "google/gemma-3-12b-it:free",
    ]);
    const knownLimitModels = new Set([
      "nousresearch/hermes-3-llama-3.1-405b:free",
      "minimax/minimax-m2.5:free",
      "meta-llama/llama-3.2-3b-instruct:free",
      "meta-llama/llama-3.3-70b-instruct:free",
      "google/gemma-3-27b-it:free",
      "google/gemma-3n-e2b-it:free",
      "google/gemma-3n-e4b-it:free",
      "google/gemma-3-4b-it:free",
      "openai/gpt-oss-20b:free",
      "openai/gpt-oss-120b:free",
      "qwen/qwen3-coder:free",
      "qwen/qwen3-next-80b-a3b-instruct:free",
      "z-ai/glm-4.5-air:free",
      "cognitivecomputations/dolphin-mistral-24b-venice-edition:free",
    ]);
    const knownStalledModels = new Set([
      "liquid/lfm-2.5-1.2b-thinking:free",
      "liquid/lfm-2.5-1.2b-thinking-20260120:free",
      "liquid/lfm-2.5-1.2b-instruct:free",
    ]);
    const knownCreditModels = new Set([
      "sourceful/riverflow-v2-pro",
      "sourceful/riverflow-v2-fast",
      "sourceful/riverflow-v2-max-preview",
      "sourceful/riverflow-v2-standard-preview",
      "sourceful/riverflow-v2-fast-preview",
      "black-forest-labs/flux.2-klein-4b",
      "black-forest-labs/flux.2-max",
      "black-forest-labs/flux.2-flex",
      "black-forest-labs/flux.2-pro",
      "bytedance-seed/seedream-4.5",
    ]);
    const knownEmbeddingModels = new Set([
      "nvidia/llama-nemotron-embed-vl-1b-v2:free",
      "nvidia/nemotron-nano-12b-v2-vl:free",
    ]);
    const extraKnownModels = [
      "sourceful/riverflow-v2-pro",
      "sourceful/riverflow-v2-fast",
      "sourceful/riverflow-v2-max-preview",
      "sourceful/riverflow-v2-standard-preview",
      "sourceful/riverflow-v2-fast-preview",
      "black-forest-labs/flux.2-klein-4b",
      "black-forest-labs/flux.2-max",
      "black-forest-labs/flux.2-flex",
      "black-forest-labs/flux.2-pro",
      "bytedance-seed/seedream-4.5",
      "nvidia/llama-nemotron-embed-vl-1b-v2:free",
      "nvidia/nemotron-nano-12b-v2-vl:free",
    ];
    const modelHealth = {
      ok: new Set(),
      stalled: new Set(),
      limit: new Set(),
      credit: new Set(),
      incompat: new Set(),
      other: new Set(),
    };

    function setStatus(ok, text) {
      statusDot.classList.toggle("ok", !!ok);
      statusText.textContent = text;
    }

    function setActiveModel(model, triedModels) {
      const tried = Array.isArray(triedModels) && triedModels.length
        ? ` | denenen: ${triedModels.join(" -> ")}`
        : "";
      activeModelEl.textContent = `Aktif model: ${model || "-"}${tried}`;
    }

    function addOptionIfMissing(model) {
      if (!model) return;
      const exists = Array.from(modelSelectEl.options).some(o => o.value === model);
      if (!exists) {
        const option = document.createElement("option");
        option.value = model;
        option.textContent = model;
        modelSelectEl.appendChild(option);
      }
    }

    function classifyModelForSelection(model) {
      const m = (model || "").trim();
      if (!m) return "other";
      if (knownStalledModels.has(m)) return "stalled";
      if (knownEmbeddingModels.has(m) || m.includes("embed")) return "embedding";
      if (knownCreditModels.has(m)) return "credit";
      if (knownOkModels.has(m)) return "ok";
      if (knownLimitModels.has(m)) return "limit";
      return "other";
    }

    function refreshModelOptions() {
      modelSelectEl.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Model sec...";
      modelSelectEl.appendChild(placeholder);

      const selectedCategory = modelCategoryEl.value || "all";
      const groups = {
        ok: [],
        stalled: [],
        limit: [],
        credit: [],
        embedding: [],
        other: [],
      };

      const unique = new Set();
      const addModel = (model) => {
        const m = (model || "").trim();
        if (!m || unique.has(m)) return;
        unique.add(m);
        const category = classifyModelForSelection(m);
        groups[category].push(m);
      };

      manualModelCandidates.forEach(addModel);
      extraKnownModels.forEach(addModel);
      if (statusInfo) {
        addModel(statusInfo.default_model);
        (statusInfo.fallback_models || []).forEach(addModel);
      }

      const catOrder = ["ok", "stalled", "limit", "credit", "embedding", "other"];
      const catLabel = {
        ok: "Sorunsuz Calisanlar",
        stalled: "Tikananlar",
        limit: "Limit Hatasi (429)",
        credit: "Para/Kredi Gerektiren (402)",
        embedding: "Embedding/VL (chat uyumsuz)",
        other: "Diger/Belirsiz",
      };

      for (const cat of catOrder) {
        if (selectedCategory !== "all" && selectedCategory !== cat) continue;
        const models = groups[cat];
        if (!models.length) continue;
        models.sort();
        const optgroup = document.createElement("optgroup");
        optgroup.label = catLabel[cat];
        for (const model of models) {
          const option = document.createElement("option");
          option.value = model;
          option.textContent = model;
          optgroup.appendChild(option);
        }
        modelSelectEl.appendChild(optgroup);
      }
    }

    function classifyError(errorText) {
      const txt = String(errorText || "").toLowerCase();
      if (txt.includes("(429)") || txt.includes("rate-limit")) return "limit";
      if (txt.includes("(402)") || txt.includes("insufficient credits")) return "credit";
      if (txt.includes("(400)") && (txt.includes("embedding model") || txt.includes("cannot be used with the chat/completions endpoint"))) return "incompat";
      return "other";
    }

    function renderHealth() {
      const print = (setObj) => {
        const arr = Array.from(setObj);
        return arr.length ? arr.join(", ") : "-";
      };
      healthOkEl.innerHTML = `<span class="pill pill-ok">CALISTI</span>${print(modelHealth.ok)}`;
      healthStalledEl.innerHTML = `<span class="pill pill-other">TIKANAN</span>${print(modelHealth.stalled)}`;
      healthLimitEl.innerHTML = `<span class="pill pill-limit">LIMIT 429</span>${print(modelHealth.limit)}`;
      healthCreditEl.innerHTML = `<span class="pill pill-credit">API/KREDI 402</span>${print(modelHealth.credit)}`;
      healthIncompatEl.innerHTML = `<span class="pill pill-incompat">UYUMSUZ 400</span>${print(modelHealth.incompat)}`;
      healthOtherEl.innerHTML = `<span class="pill pill-other">DIGER</span>${print(modelHealth.other)}`;
    }

    function recordModelStatus(model, type) {
      if (!model || !type || !modelHealth[type]) return;
      modelHealth[type].add(model);
      renderHealth();
    }

    function selectedManualModel() {
      const custom = (customModelEl.value || "").trim();
      if (custom) return custom;
      const selected = (modelSelectEl.value || "").trim();
      return selected || "";
    }

    function updateModelUiState() {
      const isManual = modelModeEl.value === "manual";
      modelCategoryEl.disabled = !isManual || streaming;
      modelSelectEl.disabled = !isManual || streaming;
      customModelEl.disabled = !isManual || streaming;
    }

    function addMessage(role, text) {
      const box = document.createElement("div");
      box.className = `msg ${role === "user" ? "user" : "assistant"}`;
      box.textContent = text || "";
      chatEl.appendChild(box);
      chatEl.scrollTop = chatEl.scrollHeight;
      return box;
    }

    function appendMeta(target, text) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = text;
      target.appendChild(meta);
    }

    async function checkStatus() {
      try {
        const statusRes = await fetch("/api/llm/openrouter/status");
        const statusData = await statusRes.json();
        statusInfo = statusData;
        manualModelCandidates.length = 0;
        if (statusData && statusData.default_model) {
          manualModelCandidates.push(statusData.default_model);
        }
        if (statusData && Array.isArray(statusData.fallback_models)) {
          manualModelCandidates.push(...statusData.fallback_models);
        }
        refreshModelOptions();
        if (statusRes.ok && statusData.available) {
          if (statusData.configured) {
            setStatus(true, `Hazir`);
            setActiveModel(statusData.default_model, statusData.fallback_models || []);
            if (!modelSelectEl.value && statusData.default_model) {
              modelSelectEl.value = statusData.default_model;
            }
          } else {
            setStatus(false, "OPENROUTER_API_KEY tanimli degil");
          }
        } else {
          setStatus(false, "OpenRouter servisi hazir degil");
        }
      } catch (err) {
        setStatus(false, "Sunucuya baglanilamadi");
      }
    }

    function toggleUi(isBusy) {
      streaming = isBusy;
      sendBtn.disabled = isBusy;
      clearBtn.disabled = isBusy;
      inputEl.disabled = isBusy;
      modelModeEl.disabled = isBusy;
      updateModelUiState();
    }

    async function sendMessage() {
      if (streaming) return;

      const prompt = inputEl.value.trim();
      if (!prompt) return;
      const isManual = modelModeEl.value === "manual";
      const forcedModel = isManual ? selectedManualModel() : "";
      currentAttemptModel = forcedModel || "";
      if (isManual && !forcedModel) {
        setStatus(false, "Manuel modda model sec veya yaz");
        return;
      }

      inputEl.value = "";
      addMessage("user", prompt);
      messages.push({ role: "user", content: prompt });

      const assistantBox = addMessage("assistant", "");
      toggleUi(true);
      setStatus(true, "Canli akis devam ediyor...");

      try {
        const response = await fetch("/api/llm/openrouter/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages,
            model: forcedModel || undefined,
            use_fallback: !isManual,
          }),
        });

        if (!response.ok || !response.body) {
          let errText = `HTTP ${response.status}`;
          try {
            const payload = await response.json();
            if (payload.error) errText = payload.error;
          } catch (_) {}
          assistantBox.textContent = `[Hata] ${errText}`;
          setStatus(false, "Istek hatasi");
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let output = "";
        let usageText = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            let payload = null;
            try {
              payload = JSON.parse(trimmed);
            } catch (_) {
              continue;
            }

            if (payload.type === "token") {
              output += payload.text || "";
              assistantBox.textContent = output;
              chatEl.scrollTop = chatEl.scrollHeight;
              if (currentAttemptModel) {
                recordModelStatus(currentAttemptModel, "ok");
              }
            } else if (payload.type === "meta") {
              if (payload.model) {
                currentAttemptModel = payload.model;
                setActiveModel(payload.model, payload.tried_models || []);
              }
              if (payload.phase === "start") {
                setStatus(true, `Model deneniyor: ${payload.model}`);
                if (modelModeEl.value === "auto") {
                  appendMeta(assistantBox, `Deneniyor: ${payload.model}`);
                }
              } else if (payload.phase === "fallback") {
                setStatus(true, `Fallback: ${payload.model} basarisiz, siradaki deneniyor`);
                appendMeta(assistantBox, `Basarisiz: ${payload.model} | ${payload.error || "hata"}`);
              } else if (payload.phase === "success") {
                setStatus(true, `Hazir`);
                if (modelModeEl.value === "auto") {
                  appendMeta(assistantBox, `Basarili model: ${payload.model}`);
                }
              }
              const u = payload.usage || {};
              usageText = `model: ${payload.model || "-"} | token: ${u.total_tokens || "-"}`;
            } else if (payload.type === "error") {
              assistantBox.textContent = `[Hata] ${payload.error || "Bilinmeyen hata"}`;
              const kind = classifyError(payload.error);
              recordModelStatus(currentAttemptModel, kind);
              setStatus(false, "Akis hatasi");
            }
          }
        }

        if (output) {
          messages.push({ role: "assistant", content: output });
        }
        if (usageText) {
          appendMeta(assistantBox, usageText);
        }

        if (!output && !assistantBox.textContent.trim()) {
          assistantBox.textContent = "[Bos yanit]";
          if (currentAttemptModel) {
            recordModelStatus(currentAttemptModel, "stalled");
          }
        }

        setStatus(true, "Hazir");
      } catch (err) {
        assistantBox.textContent = `[Hata] ${err.message || err}`;
        setStatus(false, "Baglanti hatasi");
      } finally {
        toggleUi(false);
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    clearBtn.addEventListener("click", () => {
      chatEl.innerHTML = "";
      messages.length = 0;
      setStatus(true, "Temizlendi");
      inputEl.focus();
    });
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    modelModeEl.addEventListener("change", updateModelUiState);
    modelCategoryEl.addEventListener("change", refreshModelOptions);
    updateModelUiState();

    checkStatus();
    inputEl.focus();
  </script>
</body>
</html>
